name: Renovate Config Validation

on:
  push:
    branches:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

permissions:
  contents: read

jobs:
  validate:
    uses: gitify-app/renovate-config/.github/workflows/renovate-config-validator.yml@main
