name: Renovate Config Validation

on:
  push:
    branches:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

permissions:
  contents: read

jobs:
  validate:
    uses: gitify-app/renovate-config/.github/workflows/renovate-config-validator.yml@fe1d5e91f4c46fb4bc7a131afe3bb1239c39a3fb # main
